<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020202">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>J.A.R.V.I.S. // BIOMETRIC ACCESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>

  :root{
    --amber:        #ffaa00;
    --amber-bright: #ffe0a0;
    --amber-hot:    #fff2cf;
    --amber-dim:    #6b4400;
    --amber-glass:  rgba(255,170,0,0.08);
    --panel-bg:     rgba(7,8,5,0.82);
    --red:          #ff3b30;
    --green:        #35ff8a;
    --text-dim:     #8a6a2a;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  button, input{ font:inherit; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--amber-bright); outline-offset:3px; }
  button:disabled{ cursor:not-allowed; opacity:0.55; }

  html,body{
    width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 45%, #0b0906 0%, #050403 45%, #000000 100%);
    font-family:'Share Tech Mono', monospace;
    color: var(--amber);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient moving grid backdrop (pure CSS, cheap) ---------- */
  #grid{
    position:fixed; inset:-2px; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,170,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,170,0,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
    animation: gridDrift 22s linear infinite;
    opacity:0.5;
  }
  @keyframes gridDrift{ from{ background-position:0 0, 0 0; } to{ background-position:0 460px, 460px 0; } }
  #vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 40%, #000 100%);
  }

  .bracket{ position:fixed; width:46px; height:46px; border:1.5px solid var(--amber); opacity:0.45; z-index:5; }
  .bracket.tl{ top:18px; left:18px; border-right:none; border-bottom:none; }
  .bracket.tr{ top:18px; right:18px; border-left:none; border-bottom:none; }
  .bracket.bl{ bottom:18px; left:18px; border-right:none; border-top:none; }
  .bracket.br{ bottom:18px; right:18px; border-left:none; border-top:none; }

  #header{
    position:fixed; top:0; left:0; right:0; z-index:5;
    text-align:center; padding:26px 20px 0 20px;
    letter-spacing:6px;
  }
  #header h1{
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:22px;
    color:var(--amber-bright); text-shadow:0 0 14px rgba(255,180,60,0.6);
  }
  #header p{ margin-top:6px; font-size:10px; letter-spacing:3px; color:var(--text-dim); }

  /* ---------- main stage ---------- */
  #stage{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
  }

  #scanFrame{
    position:relative; width:380px; height:380px;
    border:1px solid var(--amber-dim);
    background:#050402;
    overflow:hidden;
  }
  #scanFrame::before, #scanFrame::after{
    content:''; position:absolute; width:26px; height:26px; border:2px solid var(--amber);
    opacity:0.8;
  }
  #scanFrame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  #scanFrame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  #scanCornerTR, #scanCornerBL{
    position:absolute; width:26px; height:26px; border:2px solid var(--amber); opacity:0.8; z-index:4;
  }
  #scanCornerTR{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  #scanCornerBL{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  #video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1); opacity:0; transition:opacity 0.6s ease;
  }
  #video.live{ opacity:1; }
  #overlay{ position:absolute; inset:0; width:100%; height:100%; z-index:3; }

  #scanSweep{
    position:absolute; left:0; right:0; height:2px; top:0;
    background:linear-gradient(90deg, transparent, var(--amber-bright), transparent);
    box-shadow:0 0 12px var(--amber);
    z-index:3; opacity:0; pointer-events:none;
  }
  #scanSweep.active{ opacity:1; animation: sweep 2.2s ease-in-out infinite; }
  @keyframes sweep{ 0%{ top:4%; } 50%{ top:94%; } 100%{ top:4%; } }

  #idleCrosshair{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:2; pointer-events:none;
  }
  #idleCrosshair svg{ width:120px; height:120px; opacity:0.35; }
  #idleCrosshair.pulse svg{ animation: idlePulse 2.4s ease-in-out infinite; }
  @keyframes idlePulse{ 0%,100%{ opacity:0.2; transform:scale(1); } 50%{ opacity:0.5; transform:scale(1.06); } }

  #statusBlock{ text-align:center; max-width:460px; }
  #statusTitle{
    font-family:'Orbitron', sans-serif; font-size:17px; font-weight:700; letter-spacing:3px;
    color:var(--amber-bright); text-shadow:0 0 10px rgba(255,180,60,0.4);
    min-height:24px;
  }
  #statusSub{ margin-top:8px; font-size:11px; letter-spacing:1.5px; color:var(--text-dim); min-height:16px; line-height:1.5; }

  #bootBar{ width:340px; height:3px; background:rgba(255,170,0,0.12); margin-top:4px; }
  #bootBarFill{ height:100%; width:0%; background:linear-gradient(90deg,var(--amber-dim),var(--amber)); box-shadow:0 0 8px var(--amber); transition:width 0.35s ease; }

  /* ---------- name / enrollment panel ---------- */
  #enrollPanel{
    display:none; flex-direction:column; align-items:center; gap:12px;
    width:340px;
  }
  #enrollPanel input{
    width:100%; background:rgba(7,8,5,0.7); border:1px solid var(--amber-dim);
    color:var(--amber-bright); font-family:'Share Tech Mono', monospace; font-size:13px;
    letter-spacing:2px; padding:10px 12px; text-align:center; text-transform:uppercase;
  }
  #enrollPanel input:focus{ outline:none; border-color:var(--amber); }
  .btn{
    background:none; border:1px solid var(--amber-dim); color:var(--amber);
    font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:2px;
    padding:10px 22px; cursor:pointer; width:100%;
  }
  .btn:hover{ background:var(--amber-glass); border-color:var(--amber); color:var(--amber-bright); }
  .btn-row{ display:flex; gap:10px; width:100%; }
  .btn-row .btn{ width:auto; flex:1; }

  #dwellDots{ display:flex; gap:8px; }
  #dwellDots span{ width:9px; height:9px; border:1px solid var(--amber-dim); border-radius:50%; }
  #dwellDots span.filled{ background:var(--amber); border-color:var(--amber); box-shadow:0 0 6px var(--amber); }

  /* ---------- log panel ---------- */
  #logPanel{
    position:fixed; left:24px; bottom:24px; width:300px; max-height:190px;
    border:1px solid var(--amber-dim); background:rgba(7,8,5,0.75);
    padding:10px 12px; font-size:9.5px; letter-spacing:0.5px; line-height:1.7;
    color:var(--text-dim); overflow:hidden; z-index:5;
  }
  #logPanel .lp-head{ font-size:9px; letter-spacing:2px; color:var(--text-dim); margin-bottom:6px; opacity:0.8; }
  #logLines span.ok{ color:var(--amber-bright); }
  #logLines span.warn{ color:var(--red); }

  /* ---------- guest / footer controls ---------- */
  #footerControls{
    position:fixed; right:24px; bottom:24px; z-index:5;
    display:flex; flex-direction:column; align-items:flex-end; gap:8px;
  }
  #guestLink{
    font-size:10px; letter-spacing:2px; color:var(--text-dim);
    background:none; border:none; cursor:pointer; text-decoration:underline;
    text-underline-offset:3px;
  }
  #guestLink:hover{ color:var(--amber-bright); }
  #resetLink{
    font-size:9px; letter-spacing:1.5px; color:rgba(138,106,42,0.5);
    background:none; border:none; cursor:pointer;
  }
  #resetLink:hover{ color:var(--red); }

  /* ---------- access granted flash / transition ---------- */
  #grantFlash{
    position:fixed; inset:0; z-index:50; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle, rgba(255,224,160,0) 0%, rgba(0,0,0,0) 100%);
    opacity:0;
  }
  #grantFlash.show{
    animation: grantIn 1.7s ease forwards;
  }
  #grantFlash .g-text{
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:26px; letter-spacing:4px;
    color:#fff8ea; text-shadow:0 0 30px rgba(255,200,110,0.9); text-align:center; opacity:0;
  }
  @keyframes grantIn{
    0%{ opacity:0; background: radial-gradient(circle, rgba(255,224,160,0) 0%, rgba(0,0,0,0) 100%); }
    12%{ opacity:1; background: radial-gradient(circle, rgba(255,224,160,0.15) 0%, rgba(0,0,0,0) 70%); }
    50%{ opacity:1; }
    85%{ opacity:1; background: radial-gradient(circle, rgba(255,230,180,0.95) 0%, rgba(20,15,5,0.98) 100%); }
    100%{ opacity:1; background:#000; }
  }
  #grantFlash.show .g-text{ animation: textIn 1.7s ease forwards; }
  @keyframes textIn{
    0%,40%{ opacity:0; letter-spacing:10px; }
    60%{ opacity:1; letter-spacing:4px; }
    85%{ opacity:1; }
    100%{ opacity:0; }
  }

  #noteBox{
    display:none; max-width:340px; font-size:9.5px; letter-spacing:0.5px;
    color:var(--text-dim); line-height:1.6; text-align:center; margin-top:4px;
  }
  #noteBox.show{ display:block; }

  @media (max-width: 520px), (max-height: 720px){
    #header{ padding-top:18px; }
    #stage{ gap:14px; padding:74px 0 72px; }
    #scanFrame{ width:min(88vw, 52vh); height:min(88vw, 52vh); max-width:380px; max-height:380px; }
    #logPanel{ display:none; }
    #enrollPanel, #statusBlock{ width:88vw; max-width:340px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

<div id="grid"></div>
<div id="vignette"></div>
<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<div id="header">
  <h1>J.A.R.V.I.S.</h1>
  <p>BIOMETRIC ACCESS CONTROL</p>
</div>

<div id="stage">

  <div id="scanFrame">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="scanCornerTR"></div>
    <div id="scanCornerBL"></div>
    <div id="scanSweep"></div>
    <div id="idleCrosshair" class="pulse">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="46" fill="none" stroke="#ffaa00" stroke-width="1"/>
        <line x1="60" y1="4" x2="60" y2="24" stroke="#ffaa00" stroke-width="1.5"/>
        <line x1="60" y1="96" x2="60" y2="116" stroke="#ffaa00" stroke-width="1.5"/>
        <line x1="4" y1="60" x2="24" y2="60" stroke="#ffaa00" stroke-width="1.5"/>
        <line x1="96" y1="60" x2="116" y2="60" stroke="#ffaa00" stroke-width="1.5"/>
      </svg>
    </div>
  </div>

  <div id="statusBlock" role="status" aria-live="polite" aria-atomic="true">
    <div id="statusTitle">INITIALIZING</div>
    <div id="statusSub">Preparing biometric subsystem…</div>
    <div id="bootBar"><div id="bootBarFill"></div></div>
    <div id="noteBox"></div>
  </div>

  <div id="enrollPanel">
    <input id="nameInput" type="text" maxlength="24" placeholder="ENTER DESIGNATION" value="OPERATOR" autocomplete="off" spellcheck="false" aria-label="Operator designation"/>
    <button class="btn" id="beginEnrollBtn" type="button">BEGIN ENROLLMENT SCAN</button>
    <div id="dwellDots">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div id="deniedPanel" style="display:none;" class="btn-row">
    <button class="btn" id="retryBtn" type="button">TRY AGAIN</button>
    <button class="btn" id="registerNewBtn" type="button">REGISTER AS NEW OPERATOR</button>
  </div>

</div>

<div id="logPanel">
  <div class="lp-head">SYSTEM DIAGNOSTIC LOG</div>
  <div id="logLines"></div>
</div>

<div id="footerControls">
  <button id="guestLink" type="button">ENTER AS GUEST →</button>
  <button id="resetLink" type="button">RESET ALL PROFILES</button>
</div>

<div id="grantFlash"><div class="g-text" id="grantText">ACCESS GRANTED</div></div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  'use strict';

  const CONFIG = Object.freeze({
    modelUrl: 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights',
    matchThreshold: 0.55,
    matchConfirmFrames: 3,
    noMatchGraceMs: 3200,
    enrollSamples: 5,
    enrollMaxAttempts: 40,
    detectIntervalMs: 380,
    redirectDelayMs: 1650,
    maxProfiles: 8,
    descriptorLength: 128,
    profilesKey: 'jarvis_profiles',
    activeUserKey: 'jarvis_active_user'
  });

  const els = {
    video: document.getElementById('video'),
    overlay: document.getElementById('overlay'),
    sweep: document.getElementById('scanSweep'),
    idle: document.getElementById('idleCrosshair'),
    title: document.getElementById('statusTitle'),
    sub: document.getElementById('statusSub'),
    bootBar: document.getElementById('bootBar'),
    bootBarFill: document.getElementById('bootBarFill'),
    note: document.getElementById('noteBox'),
    enrollPanel: document.getElementById('enrollPanel'),
    nameInput: document.getElementById('nameInput'),
    beginEnrollBtn: document.getElementById('beginEnrollBtn'),
    dwellDots: document.querySelectorAll('#dwellDots span'),
    deniedPanel: document.getElementById('deniedPanel'),
    retryBtn: document.getElementById('retryBtn'),
    registerNewBtn: document.getElementById('registerNewBtn'),
    guestLink: document.getElementById('guestLink'),
    resetLink: document.getElementById('resetLink'),
    logLines: document.getElementById('logLines'),
    grantFlash: document.getElementById('grantFlash'),
    grantText: document.getElementById('grantText')
  };

  const ctx = els.overlay.getContext('2d');
  const detectorOptions = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.55 });

  const state = {
    mode: 'BOOT',
    scanning: false,
    scanGeneration: 0,
    detectTimer: null,
    mediaStream: null,
    redirectTimer: null,
    matchStreak: 0,
    matchStreakName: null,
    strangerSince: null,
    pausedForVisibility: false,
    destroyed: false
  };

  function nowTime(){ return new Date().toTimeString().slice(0, 8); }
  function wait(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }
  function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }

  function log(message, cls = ''){
    const line = document.createElement('div');
    const span = document.createElement('span');
    if(cls === 'ok' || cls === 'warn') span.className = cls;
    span.textContent = `[${nowTime()}] ${String(message)}`;
    line.appendChild(span);
    els.logLines.appendChild(line);
    while(els.logLines.children.length > 8) els.logLines.firstChild.remove();
  }

  function setStatus(title, sub = ''){
    els.title.textContent = title;
    els.sub.textContent = sub;
  }

  function sanitizeName(value){
    return String(value ?? '')
      .replace(/[\u0000-\u001F\u007F]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 24) || 'OPERATOR';
  }

  function normalizeDescriptor(value){
    if(!Array.isArray(value) && !(value instanceof Float32Array)) return null;
    if(value.length !== CONFIG.descriptorLength) return null;
    const result = Array.from(value, Number);
    return result.every(Number.isFinite) ? result : null;
  }

  function normalizeProfile(raw){
    if(!raw || typeof raw !== 'object') return null;
    const name = sanitizeName(raw.name);
    const source = Array.isArray(raw.descriptors) ? raw.descriptors : [raw.descriptor];
    const descriptors = source.map(normalizeDescriptor).filter(Boolean);
    if(!descriptors.length) return null;
    return {
      name,
      descriptors,
      enrolledAt: typeof raw.enrolledAt === 'string' ? raw.enrolledAt : null
    };
  }

  function loadProfiles(){
    try{
      const parsed = JSON.parse(localStorage.getItem(CONFIG.profilesKey) || '[]');
      if(!Array.isArray(parsed)) return [];
      return parsed.map(normalizeProfile).filter(Boolean).slice(0, CONFIG.maxProfiles);
    } catch(error){
      log('Stored profile data is unreadable; ignoring it for this session.', 'warn');
      return [];
    }
  }

  function saveProfiles(profiles){
    try{
      localStorage.setItem(CONFIG.profilesKey, JSON.stringify(profiles));
      return true;
    } catch(error){
      return false;
    }
  }

  function euclideanDistance(a, b){
    if(!a || !b || a.length !== b.length) return Infinity;
    let sum = 0;
    for(let i = 0; i < a.length; i++){
      const delta = a[i] - b[i];
      sum += delta * delta;
    }
    return Math.sqrt(sum);
  }

  function distanceToProfile(descriptor, profile){
    const distances = profile.descriptors
      .map(candidate => euclideanDistance(descriptor, candidate))
      .filter(Number.isFinite)
      .sort((a, b) => a - b);
    if(!distances.length) return Infinity;
    const count = Math.min(3, distances.length);
    return distances.slice(0, count).reduce((sum, value) => sum + value, 0) / count;
  }

  function bestMatch(descriptor, profiles){
    let bestProfile = null;
    let bestDistance = Infinity;
    for(const profile of profiles){
      const distance = distanceToProfile(descriptor, profile);
      if(distance < bestDistance){
        bestDistance = distance;
        bestProfile = profile;
      }
    }
    return { profile: bestProfile, distance: bestDistance };
  }

  function setActiveUser(name){
    try{
      if(name) localStorage.setItem(CONFIG.activeUserKey, name);
      else localStorage.removeItem(CONFIG.activeUserKey);
    } catch(error){ /* session can still continue without persistent storage */ }
  }

  function stopCamera(){
    if(state.mediaStream){
      state.mediaStream.getTracks().forEach(track => track.stop());
      state.mediaStream = null;
    }
    if(els.video.srcObject) els.video.srcObject = null;
  }

  function goToDashboard(name){
    setActiveUser(name);
    const url = name ? `dashboard.html?user=${encodeURIComponent(name)}` : 'dashboard.html';
    clearTimeout(state.redirectTimer);
    state.redirectTimer = setTimeout(() => {
      stopCamera();
      window.location.assign(url);
    }, CONFIG.redirectDelayMs);
  }

  function grantAccess(name){
    if(state.mode === 'GRANTED') return;
    stopDetectionLoop();
    state.mode = 'GRANTED';
    const safeName = name ? sanitizeName(name) : '';
    els.grantText.textContent = safeName ? `ACCESS GRANTED — WELCOME, ${safeName.toUpperCase()}` : 'ACCESS GRANTED';
    els.grantFlash.classList.add('show');
    setStatus('ACCESS GRANTED', safeName ? `Welcome back, ${safeName}.` : 'Welcome.');
    log(`Identity confirmed${safeName ? ` — ${safeName}` : ''}`, 'ok');
    goToDashboard(safeName || null);
  }

  async function boot(){
    const steps = [
      { pct: 12, msg: 'Calibrating sensor array… OK', delay: 260 },
      { pct: 28, msg: 'Loading neural network runtime… OK', delay: 220 }
    ];

    for(const step of steps){
      log(step.msg, 'ok');
      els.bootBarFill.style.width = `${step.pct}%`;
      await wait(step.delay);
    }

    if(state.destroyed) return;
    setStatus('LOADING MODELS', 'Downloading facial-recognition networks…');

    if(typeof faceapi === 'undefined'){
      bootFailure('Face-recognition library failed to load.');
      return;
    }

    try{
      log('Loading face detector model…');
      await faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.modelUrl);
      els.bootBarFill.style.width = '55%';
      log('Face detector online', 'ok');

      log('Loading landmark model…');
      await faceapi.nets.faceLandmark68TinyNet.loadFromUri(CONFIG.modelUrl);
      els.bootBarFill.style.width = '72%';
      log('Landmark model online', 'ok');

      log('Loading recognition model…');
      await faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.modelUrl);
      els.bootBarFill.style.width = '90%';
      log('Recognition model online', 'ok');
    } catch(error){
      bootFailure('Model download failed. Check network access and content blockers.');
      return;
    }

    if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      bootFailure('Camera APIs require HTTPS or localhost in a supported browser.');
      return;
    }

    setStatus('REQUESTING OPTICAL SENSOR', 'Grant camera access to continue…');
    log('Requesting camera permission…');

    try{
      state.mediaStream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 480 },
          height: { ideal: 480 },
          facingMode: { ideal: 'user' }
        },
        audio: false
      });
      els.video.srcObject = state.mediaStream;
      await els.video.play();
      els.video.classList.add('live');
      syncOverlaySize();
    } catch(error){
      bootFailure('Camera access was denied or no usable camera is available.');
      return;
    }

    if(state.destroyed) return;
    els.bootBarFill.style.width = '100%';
    log('All systems nominal', 'ok');
    await wait(300);
    els.bootBar.style.display = 'none';
    els.idle.classList.remove('pulse');
    els.sweep.classList.add('active');
    beginScanning();
  }

  function bootFailure(reason){
    stopDetectionLoop();
    state.mode = 'OFFLINE';
    log(reason, 'warn');
    setStatus('SENSOR OFFLINE', reason);
    els.note.textContent = 'Biometric recognition is unavailable. Serve this project over HTTPS or localhost, allow camera access, and make sure CDN resources are not blocked. Guest mode remains available.';
    els.note.classList.add('show');
    els.bootBar.style.display = 'none';
    els.idle.classList.remove('pulse');
  }

  function syncOverlaySize(){
    const width = els.video.videoWidth || 480;
    const height = els.video.videoHeight || 480;
    if(els.overlay.width !== width) els.overlay.width = width;
    if(els.overlay.height !== height) els.overlay.height = height;
  }

  function drawBox(box, color = '#ffaa00'){
    syncOverlaySize();
    ctx.clearRect(0, 0, els.overlay.width, els.overlay.height);
    if(!box) return;

    const scaleX = els.overlay.width / (els.video.videoWidth || els.overlay.width);
    const scaleY = els.overlay.height / (els.video.videoHeight || els.overlay.height);
    const x = els.overlay.width - ((box.x + box.width) * scaleX);
    const y = box.y * scaleY;
    const w = box.width * scaleX;
    const h = box.height * scaleY;
    const corner = Math.min(22, w * 0.25, h * 0.25);

    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, els.overlay.width / 240);
    ctx.beginPath();
    ctx.moveTo(x, y + corner); ctx.lineTo(x, y); ctx.lineTo(x + corner, y);
    ctx.moveTo(x + w - corner, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + corner);
    ctx.moveTo(x + w, y + h - corner); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - corner, y + h);
    ctx.moveTo(x + corner, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - corner);
    ctx.stroke();
  }

  async function captureFace(){
    if(els.video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return null;
    return faceapi
      .detectSingleFace(els.video, detectorOptions())
      .withFaceLandmarks(true)
      .withFaceDescriptor();
  }

  function isUsableFace(result){
    if(!result?.detection?.box) return false;
    const box = result.detection.box;
    const widthRatio = box.width / (els.video.videoWidth || 480);
    const heightRatio = box.height / (els.video.videoHeight || 480);
    return widthRatio >= 0.18 && heightRatio >= 0.18;
  }

  function resetMatchState(){
    state.matchStreak = 0;
    state.matchStreakName = null;
    state.strangerSince = null;
  }

  function beginScanning(){
    if(state.destroyed || state.mode === 'GRANTED') return;
    stopDetectionLoop();
    state.mode = 'SCAN';
    state.scanning = true;
    resetMatchState();
    els.enrollPanel.style.display = 'none';
    els.deniedPanel.style.display = 'none';
    const profiles = loadProfiles();
    setStatus('SCANNING', profiles.length ? 'Hold still and look at the sensor…' : 'No operators registered — show your face to begin setup.');
    scheduleDetection(0, state.scanGeneration);
  }

  function stopDetectionLoop(){
    state.scanning = false;
    state.scanGeneration += 1;
    if(state.detectTimer){
      clearTimeout(state.detectTimer);
      state.detectTimer = null;
    }
  }

  function scheduleDetection(delay, generation){
    if(!state.scanning || generation !== state.scanGeneration) return;
    clearTimeout(state.detectTimer);
    state.detectTimer = setTimeout(() => detectTick(generation), delay);
  }

  async function detectTick(generation){
    if(!state.scanning || state.mode !== 'SCAN' || generation !== state.scanGeneration) return;

    if(document.hidden || els.video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA){
      scheduleDetection(600, generation);
      return;
    }

    let result = null;
    try{
      result = await captureFace();
    } catch(error){
      log('A face-detection frame failed; retrying.', 'warn');
    }

    if(!state.scanning || state.mode !== 'SCAN' || generation !== state.scanGeneration) return;

    if(!result || !isUsableFace(result)){
      drawBox(null);
      els.idle.style.display = 'flex';
      resetMatchState();
      const profiles = loadProfiles();
      setStatus('SCANNING', profiles.length ? 'Hold still and look at the sensor…' : 'No operators registered — show your face to begin setup.');
      scheduleDetection(CONFIG.detectIntervalMs, generation);
      return;
    }

    els.idle.style.display = 'none';
    const profiles = loadProfiles();

    if(!profiles.length){
      drawBox(result.detection.box, '#ffaa00');
      setStatus('NO PROFILE FOUND', 'Register yourself as the first operator.');
      openEnroll();
      return;
    }

    const descriptor = normalizeDescriptor(result.descriptor);
    const { profile, distance } = bestMatch(descriptor, profiles);
    const isMatch = profile && distance < CONFIG.matchThreshold;

    if(isMatch){
      drawBox(result.detection.box, '#35ff8a');
      state.strangerSince = null;
      if(state.matchStreakName === profile.name) state.matchStreak += 1;
      else {
        state.matchStreakName = profile.name;
        state.matchStreak = 1;
      }
      setStatus('IDENTITY MATCH', `${profile.name} — match distance ${distance.toFixed(3)}`);
      if(state.matchStreak >= CONFIG.matchConfirmFrames){
        grantAccess(profile.name);
        return;
      }
    } else {
      drawBox(result.detection.box, '#ff3b30');
      state.matchStreak = 0;
      state.matchStreakName = null;
      if(!state.strangerSince) state.strangerSince = performance.now();
      const elapsed = performance.now() - state.strangerSince;
      setStatus('FACE NOT RECOGNIZED', `Analyzing… ${Math.ceil(clamp((CONFIG.noMatchGraceMs - elapsed) / 1000, 0, 9))}s`);
      if(elapsed >= CONFIG.noMatchGraceMs){
        showDenied();
        return;
      }
    }

    scheduleDetection(CONFIG.detectIntervalMs, generation);
  }

  function showDenied(){
    stopDetectionLoop();
    state.mode = 'DENIED';
    setStatus('ACCESS DENIED', 'This face does not match any registered operator.');
    els.deniedPanel.style.display = 'flex';
  }

  function resetDots(){
    els.dwellDots.forEach(dot => dot.classList.remove('filled'));
  }

  function openEnroll(){
    if(state.mode === 'ENROLL') return;
    stopDetectionLoop();
    state.mode = 'ENROLL';
    els.enrollPanel.style.display = 'flex';
    els.deniedPanel.style.display = 'none';
    resetDots();
    els.nameInput.focus({ preventScroll: true });
  }

  async function runEnrollment(){
    if(state.mode !== 'ENROLL' || els.beginEnrollBtn.disabled) return;

    const name = sanitizeName(els.nameInput.value);
    els.nameInput.value = name;
    const existingProfiles = loadProfiles();
    const existingIndex = existingProfiles.findIndex(profile => profile.name.toLocaleLowerCase() === name.toLocaleLowerCase());
    if(existingIndex < 0 && existingProfiles.length >= CONFIG.maxProfiles){
      setStatus('PROFILE LIMIT REACHED', `This demo stores at most ${CONFIG.maxProfiles} operator profiles. Reset profiles or reuse an existing name.`);
      log('Enrollment blocked — profile limit reached', 'warn');
      return;
    }

    els.beginEnrollBtn.disabled = true;
    els.beginEnrollBtn.textContent = 'HOLD STILL…';
    resetDots();

    const samples = [];
    let attempts = 0;

    while(samples.length < CONFIG.enrollSamples && attempts < CONFIG.enrollMaxAttempts && state.mode === 'ENROLL'){
      attempts += 1;
      let result = null;
      try{
        result = await captureFace();
      } catch(error){ /* a later attempt may succeed */ }

      if(result && isUsableFace(result)){
        const descriptor = normalizeDescriptor(result.descriptor);
        if(descriptor){
          drawBox(result.detection.box, '#ffe0a0');
          samples.push(descriptor);
          els.dwellDots[samples.length - 1]?.classList.add('filled');
          setStatus('CAPTURING', `Sample ${samples.length} of ${CONFIG.enrollSamples}`);
        }
      } else {
        setStatus('CAPTURING', 'Face not detected clearly — center your face and hold still.');
      }

      await wait(340);
    }

    if(state.mode !== 'ENROLL') return;

    if(samples.length < CONFIG.enrollSamples){
      setStatus('ENROLLMENT FAILED', 'Could not capture enough clean samples. Adjust lighting and try again.');
      log('Enrollment aborted — insufficient samples', 'warn');
      els.beginEnrollBtn.disabled = false;
      els.beginEnrollBtn.textContent = 'BEGIN ENROLLMENT SCAN';
      return;
    }

    const profiles = loadProfiles();
    const duplicateIndex = profiles.findIndex(profile => profile.name.toLocaleLowerCase() === name.toLocaleLowerCase());
    const record = { name, descriptors: samples, enrolledAt: new Date().toISOString() };
    if(duplicateIndex >= 0) profiles[duplicateIndex] = record;
    else profiles.push(record);

    const persisted = saveProfiles(profiles);
    if(persisted){
      log(`${duplicateIndex >= 0 ? 'Operator profile updated' : 'New operator enrolled'} — ${name}`, 'ok');
    } else {
      log('Profile capture succeeded, but browser storage is unavailable.', 'warn');
      setStatus('STORAGE UNAVAILABLE', 'Profile could not be saved permanently; continuing for this session.');
      await wait(650);
    }

    els.enrollPanel.style.display = 'none';
    els.beginEnrollBtn.disabled = false;
    els.beginEnrollBtn.textContent = 'BEGIN ENROLLMENT SCAN';
    grantAccess(name);
  }

  els.retryBtn.addEventListener('click', beginScanning);
  els.registerNewBtn.addEventListener('click', openEnroll);
  els.beginEnrollBtn.addEventListener('click', runEnrollment);
  els.nameInput.addEventListener('keydown', event => {
    if(event.key === 'Enter') runEnrollment();
  });

  els.guestLink.addEventListener('click', () => {
    stopDetectionLoop();
    state.mode = 'GRANTED';
    setStatus('CONTINUING AS GUEST', 'Skipping biometric verification…');
    goToDashboard(null);
  });

  els.resetLink.addEventListener('click', () => {
    if(!window.confirm('Erase all registered operator profiles on this device? This cannot be undone.')) return;
    try{
      localStorage.removeItem(CONFIG.profilesKey);
      localStorage.removeItem(CONFIG.activeUserKey);
    } catch(error){ /* storage may be unavailable */ }
    log('All operator profiles erased', 'warn');
    if(state.mode !== 'OFFLINE') beginScanning();
  });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden && state.scanning){
      state.pausedForVisibility = true;
      stopDetectionLoop();
    } else if(!document.hidden && state.pausedForVisibility && state.mode === 'SCAN'){
      state.pausedForVisibility = false;
      beginScanning();
    }
  });

  window.addEventListener('pagehide', () => {
    state.destroyed = true;
    stopDetectionLoop();
    clearTimeout(state.redirectTimer);
    stopCamera();
  }, { once: true });

  log('Boot sequence started');
  boot();
})();
</script>
</body>
</html>
